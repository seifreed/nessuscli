name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m black --check .

      - name: Check lint
        run: python -m ruff check .

      - name: Check types
        run: python -m mypy .

      - name: Run tests
        run: python -m pytest --cov=nessuscli --cov-report=term-missing --cov-fail-under=100

      - name: Check security
        run: python -m bandit -r src

      - name: Audit dependencies
        run: python -m pip_audit
